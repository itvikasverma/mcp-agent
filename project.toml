[project]
name = "mcp-agent"
version = "0.1.0"
description = "Qdrant, LangGraph, and FastAPI RAG stack with MCP tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "fastmcp",
    "httpx",
    "langchain-community",
    "langchain-core",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-mcp-adapters",
    "langchain-qdrant",
    "langchain-text-splitters",
    "langgraph",
    "openpyxl",
    "pandas",
    "pdfplumber",
    "pydantic",
    "python-docx",
    "python-dotenv",
    "python-pptx",
    "qdrant-client",
    "requests",
    "sentence-transformers",
    "unstructured",
    "uvicorn",
]

[project.scripts]
mcp-agent = "main:main"
